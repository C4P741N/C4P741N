<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" width="780" height="260">
  <defs>
    <style>
      text { font-family: 'Courier New', Courier, monospace; }
    </style>
  </defs>

  <!-- Terminal background -->
  <rect width="780" height="260" rx="10" ry="10" fill="#0d1117"/>
  <rect width="780" height="260" rx="10" ry="10" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Title bar -->
  <rect width="780" height="40" rx="10" ry="10" fill="#21262d"/>
  <rect y="20" width="780" height="20" fill="#21262d"/>
  <rect y="39" width="780" height="2" fill="#30363d"/>

  <!-- Traffic lights -->
  <circle cx="20" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="20" r="6" fill="#27c93f"/>

  <!-- Tab title -->
  <text x="390" y="25" text-anchor="middle" fill="#8b949e" font-size="12">kitukum@dev — bash — 80×24</text>

  <!-- LINE 1: whoami command -->
  <text x="24" y="75" fill="#3fb950" font-size="13">kitukum</text>
  <text x="82" y="75" fill="#8b949e" font-size="13">@</text>
  <text x="92" y="75" fill="#d29922" font-size="13">dev</text>
  <text x="122" y="75" fill="#8b949e" font-size="13">:</text>
  <text x="129" y="75" fill="#58a6ff" font-size="13">~</text>
  <text x="141" y="75" fill="#8b949e" font-size="13">$</text>
  <text x="153" y="75" fill="#e6edf3" font-size="13">cat whoami</text>

  <!-- whoami output -->
  <text x="24" y="97" fill="#8b949e" font-size="12">  role</text>
  <text x="88" y="97" fill="#e6edf3" font-size="12">   Full-Stack Engineer · Backend Systems Architect</text>
  <text x="24" y="111" fill="#8b949e" font-size="12">  web</text>
  <text x="88" y="111" fill="#58a6ff" font-size="12">    https://dancanmwanthi.com</text>
  <text x="24" y="128" fill="#8b949e" font-size="12">  focus</text>
  <text x="88" y="128" fill="#d29922" font-size="12">  Clean Code • Scalable Systems • Great UX</text>

  <!-- LINE 2: ls -la command -->
  <text x="24" y="150" fill="#3fb950" font-size="13">kitukum</text>
  <text x="82" y="150" fill="#8b949e" font-size="13">@</text>
  <text x="92" y="150" fill="#d29922" font-size="13">dev</text>
  <text x="122" y="150" fill="#8b949e" font-size="13">:</text>
  <text x="129" y="150" fill="#58a6ff" font-size="13">~</text>
  <text x="141" y="150" fill="#8b949e" font-size="13">$</text>
  <text x="153" y="150" fill="#e6edf3" font-size="13">ls -la</text>

  <!-- ls -la output -->
  <text x="24" y="171" fill="#8b949e" font-size="12">-rw-r--r--</text>
  <text x="116" y="171" fill="#d29922" font-size="12">README.md</text>
  <text x="210" y="171" fill="#8b949e" font-size="12">→ you are here</text>

  <!-- Divider -->
  <line x1="24" y1="445" x2="756" y2="445" stroke="#21262d" stroke-width="1"/>

  <!-- LINE 3: ping -->
  <text x="24" y="200" fill="#3fb950" font-size="13">kitukum</text>
  <text x="82" y="200" fill="#8b949e" font-size="13">@</text>
  <text x="92" y="200" fill="#d29922" font-size="13">dev</text>
  <text x="122" y="200" fill="#8b949e" font-size="13">:</text>
  <text x="129" y="200" fill="#58a6ff" font-size="13">~</text>
  <text x="141" y="200" fill="#8b949e" font-size="13">$</text>
  <text x="153" y="200" fill="#e6edf3" font-size="13">ping dancanmwanthi.com</text>

  <text x="24" y="220" fill="#3fb950" font-size="12">  PING dancanmwanthi.com — ttl=64 time=1ms — open for opportunities</text>

  <!-- Final prompt with cursor -->
  <text x="24" y="250" fill="#3fb950" font-size="13">kitukum</text>
  <text x="82" y="250" fill="#8b949e" font-size="13">@</text>
  <text x="92" y="250" fill="#d29922" font-size="13">dev</text>
  <text x="122" y="250" fill="#8b949e" font-size="13">:</text>
  <text x="129" y="250" fill="#58a6ff" font-size="13">~</text>
  <text x="141" y="250" fill="#8b949e" font-size="13">$</text>
  <rect x="155" y="237" width="8" height="15" fill="#e6edf3">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

</svg>
